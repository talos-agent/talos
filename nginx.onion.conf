worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name uniaolives.onion;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        location /live {
            proxy_pass http://srs:1985;
        }
    }
}